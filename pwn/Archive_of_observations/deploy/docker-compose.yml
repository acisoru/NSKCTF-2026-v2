name: archive_of_observations

services:
  alice_archive_of_observations_init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    environment:
      FLAG: '${FLAG:?Set FLAG for the challenge instance}'
    volumes:
      - formatter-secret:/formatter-secret
      - web-secret:/web-secret
      - runtime:/run/alice
    restart: 'no'
    mem_limit: 128m
    cpus: 0.5

  archive_of_observations:
    build:
      context: .
      dockerfile: Dockerfile
      target: formatter
    depends_on:
      alice_archive_of_observations_init:
        condition: service_completed_successfully
    volumes:
      - formatter-secret:/formatter-secret:ro
      - runtime:/run/alice
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

  alice_archive_of_observations_web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    depends_on:
      alice_archive_of_observations_init:
        condition: service_completed_successfully
      archive_of_observations:
        condition: service_started
    environment:
      PWN_CAPTCHA: '${PWN_CAPTCHA:-1}'
      PWN_CAPTCHA_TEST_TOKEN: '${PWN_CAPTCHA_TEST_TOKEN:-}'
    ports:
      - '127.0.0.1:18110:8080'
    volumes:
      - web-secret:/web-secret:ro
      - runtime:/run/alice:ro
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

volumes:
  formatter-secret:
  web-secret:
  runtime:
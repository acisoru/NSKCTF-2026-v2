{% extends "base.html" %}
{% set active = 'register' %}

{% block content %}
<div class="page-head">
    <h1>Регистрация</h1>
    <p class="subtitle">Новая учётная запись наблюдателя</p>
</div>

<div class="auth-wrap">
    <div class="card">
        {% if user %}
            <p class="lead">Вы вошли как <b>{{ user }}</b>.</p>
            <a class="btn" href="/cards" style="margin-top:1rem;">Перейти к карточкам</a>
        {% else %}
            {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
            <form method="post" action="/register" class="form">
                <label>Имя наблюдателя<input type="text" name="username" required autofocus></label>
                <label>Пароль<input type="password" name="password" required></label>
                <button class="btn" type="submit">Зарегистрироваться</button>
            </form>
            <p class="auth-switch">Уже есть учётная запись? <a href="/login">Войти</a></p>
        {% endif %}
    </div>
</div>
{% endblock %}

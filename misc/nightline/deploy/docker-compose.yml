name: nightline

services:
  nightline_app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3386}:8000"
    environment:
      FLAG: ${FLAG:?Set FLAG in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      DATABASE_URL: postgresql://nightline:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@nightline_db:5432/nightline
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-48}
      SUBMIT_INTERVAL: ${SUBMIT_INTERVAL:-1.5}
      REGENERATE_INTERVAL: ${REGENERATE_INTERVAL:-30}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    depends_on:
      nightline_db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    pids_limit: 128
    mem_limit: 512m
    cpus: 2
    restart: unless-stopped

  nightline_db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nightline
      POSTGRES_USER: nightline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    volumes:
      - nightline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nightline -d nightline"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    security_opt:
      - no-new-privileges:true
    shm_size: 128m
    pids_limit: 128
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

volumes:
  nightline_pgdata:

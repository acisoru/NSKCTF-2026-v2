name: labx-network
services:
  network_secrets:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      target: web
    pull_policy: build
    user: "0:0"
    command: ["node", "server/init-secret.mjs"]
    restart: "no"
    network_mode: none
    read_only: true
    healthcheck:
      disable: true
    volumes:
      - network_secrets:/secrets
    mem_limit: 64m
    cpus: 0.2
  network_ops:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      target: web
    pull_policy: build
    restart: unless-stopped
    init: true
    depends_on:
      network_secrets:
        condition: service_completed_successfully
      network_checker:
        condition: service_healthy
      network_checker_2:
        condition: service_healthy
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:3388}"
      YANDEX_CLIENT_ID: "${YANDEX_CLIENT_ID:-}"
      YANDEX_CLIENT_SECRET: "${YANDEX_CLIENT_SECRET:-}"
      ANTICHEAT_BAN_SECONDS: "${ANTICHEAT_BAN_SECONDS:-86400}"
      TRUST_PROXY: "true"
      CHECKER_URLS: http://network_checker:9134,http://network_checker_2:9134
      CHECKER_TOKEN_FILE: /secrets/checker
      FLAG_EASY: "${FLAG_EASY:-nskctf{copper_has_no_shortcuts_4f27c1}}"
      FLAG_MEDIUM: "${FLAG_MEDIUM:-nskctf{a_link_is_not_a_network_8a16d2}}"
      FLAG_HARD: "${FLAG_HARD:-nskctf{redundancy_survived_the_revision_c31e90}}"
    ports: ["127.0.0.1:3388:3388"]
    networks: [default, lab_control]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - network_progress:/app/data
      - network_secrets:/secrets:ro
    mem_limit: 1g
    cpus: 1.0
  network_checker:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      target: checker
    pull_policy: build
    restart: unless-stopped
    init: true
    depends_on:
      network_secrets:
        condition: service_completed_successfully
    privileged: true
    environment:
      CHECKER_TOKEN_FILE: /secrets/checker
    networks: [lab_control]
    volumes:
      - network_secrets:/secrets:ro
    tmpfs:
      - /run
      - /tmp
    mem_limit: 3g
    cpus: 2.5
  network_checker_2:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      target: checker
    pull_policy: build
    restart: unless-stopped
    init: true
    depends_on:
      network_secrets:
        condition: service_completed_successfully
    privileged: true
    environment:
      CHECKER_TOKEN_FILE: /secrets/checker
    networks: [lab_control]
    volumes:
      - network_secrets:/secrets:ro
    tmpfs:
      - /run
      - /tmp
    mem_limit: 3g
    cpus: 2.5
networks:
  lab_control:
    internal: true
volumes:
  network_progress:
  network_secrets:

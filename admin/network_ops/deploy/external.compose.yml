name: labx-network
services:
  network_ops:
    build:
      context: ./src
      dockerfile: ../Dockerfile
      target: web
    pull_policy: build
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:3388}"
      YANDEX_CLIENT_ID: "${YANDEX_CLIENT_ID:-}"
      YANDEX_CLIENT_SECRET: "${YANDEX_CLIENT_SECRET:-}"
      ANTICHEAT_BAN_SECONDS: "${ANTICHEAT_BAN_SECONDS:-86400}"
      TRUST_PROXY: "true"
      CHECKER_URLS: "${CHECKER_URLS:?Set private worker URLs}"
      CHECKER_TOKEN: "${CHECKER_TOKEN:?Set the same random token on app and workers}"
      FLAG_EASY: "${FLAG_EASY:-nskctf{copper_has_no_shortcuts_4f27c1}}"
      FLAG_MEDIUM: "${FLAG_MEDIUM:-nskctf{a_link_is_not_a_network_8a16d2}}"
      FLAG_HARD: "${FLAG_HARD:-nskctf{redundancy_survived_the_revision_c31e90}}"
    ports: ["127.0.0.1:3388:3388"]
    volumes: ["network_progress:/app/data"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1.0
    mem_limit: 1g
volumes:
  network_progress:
